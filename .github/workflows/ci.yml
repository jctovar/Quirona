name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Pruebas y cobertura
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      # El lint aún arrastra errores conocidos (ver README). No bloquea el CI
      # para no impedir la integración mientras se paga esa deuda técnica.
      - name: Lint (informativo)
        run: npm run lint
        continue-on-error: true

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores de relleno: las pruebas E2E solo recorren páginas públicas y
      # no realizan peticiones autenticadas a Supabase.
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: dummy-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Build de producción
        run: npm run build

      - name: Pruebas E2E
        run: npm run test:e2e

      - name: Publicar reporte E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
